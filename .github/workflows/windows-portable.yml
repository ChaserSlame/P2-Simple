name: Windows portable package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: P2ViewerPlus-windows-x64
          path: dist/P2ViewerPlus-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist/P2ViewerPlus-windows-x64.zip --generate-notes
