[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2viewerplus-python"
version = "0.1.0"
description = "Python reconstruction starter for browsing Panasonic P2 media"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
p2viewerplus = "p2viewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
